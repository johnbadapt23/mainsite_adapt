name: Generate Critical CSS

# Generates per-page critical CSS (SESSION-HANDOFF.md S111-S114) and
# uploads it directly to staging's assets/critical/ directory -- NOT
# through the normal git-tracked deploy.yml pipeline. assets/critical/ is
# gitignored on purpose (see .gitignore): these are generated artifacts,
# not source, and routing them through a git commit would mean every run
# creates an automated commit in this repo's history.
#
# Runs on a schedule and self-discovers what to generate by querying
# staging's own WP REST API (see tools/critical-css/generate.js) -- no
# WordPress-side hook, no webhook, no new credential of any kind. An
# earlier version of this plan (S112) used a WordPress save_post hook
# calling a GitHub repository_dispatch API, which needed a GitHub PAT
# stored in wp-config.php on the server; that was dropped (S114) once a
# page-count check showed only ~42 pages actually need this (the 17
# flexible-content templates from S110), small enough that a full regen
# every run is simpler and safer than incremental change-tracking, and it
# means an ACF Options-page edit (sitewide header/footer fields) is picked
# up automatically on the next run instead of needing its own detection
# hook.
#
# Deliberately isolated from the theme's own package.json: this workflow's
# `npm ci` runs inside tools/critical-css/, which has its own
# package.json/package-lock.json pinning `critical` (pulls in Puppeteer +
# Chromium). deploy.yml's own `npm ci` at the repo root never sees this
# dependency, so ordinary theme deploys don't pay for a Chromium download
# they don't need.

on:
  schedule:
    # Every 30 minutes. ~42 pages x 2 viewports each run; adjust the
    # interval based on observed run time and how quickly editors expect
    # content changes to show up deferred -- the fallback in functions.php
    # (adapt_get_critical_css_path()) means a page between runs just keeps
    # loading its CSS fully blocking, never broken, only not-yet-optimized.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      payload_json:
        description: 'Optional: JSON array of {"post_id":123,"url":"https://staging.adapt.com.au/..."} to generate for specific pages instead of the full discovered set (leave blank for a normal full run)'
        type: string
        required: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/critical-css/package-lock.json

      - name: Install critical-css tooling
        working-directory: tools/critical-css
        run: npm ci --no-audit --no-fund

      - name: Generate critical CSS
        working-directory: tools/critical-css
        env:
          PAYLOAD_JSON: ${{ github.event.inputs.payload_json }}
          STAGING_BASE_URL: https://${{ vars.STAGING_PUBLIC_HOST || 'staging.adapt.com.au' }}
        run: |
          if [ -n "$PAYLOAD_JSON" ]; then
            node generate.js --payload "$PAYLOAD_JSON"
          else
            node generate.js --base-url "$STAGING_BASE_URL"
          fi

      # sync: 'full' is required here, not 'delta' -- delta mode determines
      # what changed via `git diff` against this repo's git history (see
      # deploy.yml's own extensive comment on this action), and
      # assets/critical/*.css is gitignored, so it never appears in git
      # history at all. Delta would silently upload nothing, every run.
      # Scoping local-path/remote-path to just this one directory keeps a
      # 'full' sync fast and harmless (it only ever touches this subtree,
      # never the rest of the theme).
      - name: Deploy critical CSS to staging
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: 'sftp'
          remote-host: ${{ vars.STAGING_HOST }}
          remote-port: ${{ vars.STAGING_PORT || 22 }}
          remote-user: ${{ secrets.STAGING_USERNAME }}
          remote-password: ${{ secrets.STAGING_PASS }}
          local-path: './assets/critical/'
          remote-path: '${{ vars.STAGING_REMOTE_PATH || secrets.STAGING_REMOTE_PATH }}/assets/critical'
          sync: 'full'
