name: Build and Deploy Theme

# Runs on every push to the "dev" branch:
#   1. Installs Node deps and compiles CSS/JS from source/ via gulp
#      (build:styles compiles source/scss -> assets/css/main.min.css,
#       build:scripts bundles source/js + vendor libs -> assets/js/main.min.js)
#   2. Uploads the theme to the server via rsync over SSH.
#
# Uses the "staging" GitHub environment (Settings -> Environments -> staging),
# which has all required values configured:
#   STAGING_HOST         (environment variable) 170.64.171.69
#   STAGING_PORT         (environment variable) 2222
#   STAGING_REMOTE_PATH  (environment variable) should be set to
#                        /public_html/wp-content/themes/adapt_optimize
#   STAGING_USERNAME     (environment secret)
#   STAGING_PASS         (environment secret)
#
# STAGING_REMOTE_PATH deliberately points at a *separate* theme folder
# ("adapt_optimize") rather than the live "adapt" folder -- this deploys a
# parallel copy of the theme so it can be tested/activated independently in
# wp-admin without touching (or needing to revert) the currently-live theme.

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # package-lock.json was regenerated (Aug 2026) to lockfileVersion 3 --
      # it had been stuck on the old lockfileVersion 1 format, which doesn't
      # store full resolution/integrity data, so every npm install had to
      # re-resolve the whole dependency tree from the registry from scratch
      # (npm's own "old lockfile ... this is a one-time fix-up" warning, except
      # it repeated on every single run since CI never commits the result back).
      # It was also genuinely out of sync with package.json (npm ci failed
      # with dozens of "Missing"/"Invalid" entries). Now that the lockfile is
      # current and in sync, npm ci is the right tool: it installs exactly
      # what's pinned, skips dependency resolution entirely, and -- combined
      # with the cache: 'npm' above -- lets actions/setup-node skip re-downloading
      # anything when package-lock.json hasn't changed since the last run.
      # If dependencies are ever added/updated, regenerate the lockfile locally
      # with `npm install` and commit it -- npm ci will hard-fail otherwise.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # fontforge is no longer needed here: gulp-fontgen's require() was moved
      # inside the build:fonts task itself (source/gulp/tasks/build/fonts.js),
      # so loading the task registry for build:styles/build:scripts no longer
      # transitively requires it. See that file for the full explanation.
      - name: Compile CSS and JS
        run: npx gulp build:styles build:scripts

      # wlixcc/SFTP-Deploy-Action (previously used here) always does a full
      # recursive "sftp put -r" of every included file, on every run, with no
      # diffing -- confirmed by reading its entrypoint.sh directly. Its
      # rsyncArgs option only pre-filters files into a LOCAL staging folder
      # (that's how the --exclude patterns below work); it never syncs
      # incrementally against the remote. That's the documented cause of this
      # action being slow (see wlixcc/SFTP-Deploy-Action#38) and was eating
      # several minutes of the ~7min build on its own, uploading all ~740
      # files/~17MB regardless of what actually changed.
      #
      # Replaced with a real rsync invocation over SSH, authenticating with
      # the same STAGING_USERNAME/STAGING_PASS secrets as before (via
      # sshpass, no new secrets needed). Real rsync compares file size/mtime
      # against what's already on the server and only transfers what changed
      # -- repeat deploys with a small diff should take seconds, not minutes.
      #
      # Requirement this depends on: the STAGING_PORT (2222) account needs to
      # accept a real SSH shell command (rsync invokes `rsync --server ...`
      # remotely over SSH), not just raw SFTP file transfer. Cloudways
      # generally provides this by default, but if this step fails with a
      # permission/command-not-found error, that means the account is
      # SFTP-only and this approach needs reverting to the previous action.
      #
      # No --delete flag: matches the old action's behavior of only adding/
      # updating files, never removing anything from the remote that's no
      # longer in the repo. Can be added later as a deliberate choice if
      # stale-file cleanup on the server is wanted.
      - name: Deploy over rsync/SSH
        env:
          SSHPASS: ${{ secrets.STAGING_PASS }}
          STAGING_USERNAME: ${{ secrets.STAGING_USERNAME }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_PORT: ${{ vars.STAGING_PORT || 22 }}
          STAGING_REMOTE_PATH: ${{ vars.STAGING_REMOTE_PATH || secrets.STAGING_REMOTE_PATH }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y sshpass
          sshpass -e rsync -avz \
            -e "ssh -p $STAGING_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=5" \
            --exclude=.git \
            --exclude=.github \
            --exclude=.gitignore \
            --exclude=.gitattributes \
            --exclude=node_modules \
            --exclude=source \
            --exclude=_archive \
            --exclude=package.json \
            --exclude=package-lock.json \
            --exclude=gulpfile.js \
            --exclude=faviconData.json \
            --exclude=README.md \
            ./ "$STAGING_USERNAME@$STAGING_HOST:$STAGING_REMOTE_PATH"
