name: Build and Deploy Theme

# Runs on every push to the "dev" branch:
#   1. Installs Node deps and compiles CSS/JS from source/ via gulp
#      (build:styles compiles source/scss -> assets/css/main.min.css --
#       kept as an unused rollback artifact, see the footer-split note
#       below; build:styles-split compiles the same source, minus the
#       footer partial, into the two files actually enqueued --
#       assets/css/main-nofooter.min.css and assets/css/footer.min.css;
#       build:scripts bundles source/js + vendor libs -> assets/js/main.min.js)
#   2. Uploads the theme to the server over SFTP.
#
# Uses the "staging" GitHub environment (Settings -> Environments -> staging),
# which has all required values configured:
#   STAGING_HOST         (environment variable) 170.64.171.69
#   STAGING_PORT         (environment variable) 2222
#   STAGING_REMOTE_PATH  (environment variable) should be set to
#                        /public_html/wp-content/themes/adapt_optimize
#   STAGING_USERNAME     (environment secret)
#   STAGING_PASS         (environment secret)
#
# STAGING_REMOTE_PATH deliberately points at a *separate* theme folder
# ("adapt_optimize") rather than the live "adapt" folder -- this deploys a
# parallel copy of the theme so it can be tested/activated independently in
# wp-admin without touching (or needing to revert) the currently-live theme.

on:
  push:
    branches:
      - dev
  # Adds the "Run workflow" button in the Actions tab, for redeploying
  # without a new commit, or for one-off runs (e.g. sync_mode: full if
  # staging's remote content ever drifts from what git's delta diff
  # expects -- see the sync-mode note further down).
  workflow_dispatch:
    inputs:
      sync_mode:
        description: 'Deploy sync mode (use "full" to force a complete re-upload, "delta" for the normal incremental sync)'
        type: choice
        options:
          - delta
          - full
        default: delta

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 (full history, not just the last commit) is needed
          # for the deploy action's "delta" sync mode further down, which
          # diffs against the previously-deployed revision to figure out what
          # changed. Harmless for the "full" sync mode used for now too.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # package-lock.json was regenerated (Aug 2026) to lockfileVersion 3 --
      # it had been stuck on the old lockfileVersion 1 format, which doesn't
      # store full resolution/integrity data, so every npm install had to
      # re-resolve the whole dependency tree from the registry from scratch
      # (npm's own "old lockfile ... this is a one-time fix-up" warning, except
      # it repeated on every single run since CI never commits the result back).
      # It was also genuinely out of sync with package.json (npm ci failed
      # with dozens of "Missing"/"Invalid" entries). Now that the lockfile is
      # current and in sync, npm ci is the right tool: it installs exactly
      # what's pinned, skips dependency resolution entirely, and -- combined
      # with the cache: 'npm' above -- lets actions/setup-node skip re-downloading
      # anything when package-lock.json hasn't changed since the last run.
      # If dependencies are ever added/updated, regenerate the lockfile locally
      # with `npm install` and commit it -- npm ci will hard-fail otherwise.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # fontforge is no longer needed here: gulp-fontgen's require() was moved
      # inside the build:fonts task itself (source/gulp/tasks/build/fonts.js),
      # so loading the task registry for build:styles/build:scripts no longer
      # transitively requires it. See that file for the full explanation.
      - name: Compile CSS and JS
        run: npx gulp build:styles build:styles-split build:scripts

      # Two prior deploy approaches were tried and ruled out here:
      #  1. wlixcc/SFTP-Deploy-Action (original) -- always does a full,
      #     non-incremental "sftp put -r" of every file, every run (confirmed
      #     by reading its entrypoint.sh). Its rsyncArgs only pre-filters
      #     files into a local staging folder, it never diffs against the
      #     remote. Slow (~7min) but reliably worked against this account.
      #  2. Plain `rsync` over SSH -- real incremental diffing, but requires
      #     a remote SSH *shell* (rsync invokes `rsync --server` on the far
      #     end). This account rejected it outright: "Shell access is
      #     disabled". Reverted.
      #
      # milanmk/actions-file-deployer supports SFTP with password auth (no
      # SSH key needed) using only plain SFTP put/delete/stat operations --
      # no remote shell command execution required, so it worked on this
      # shell-disabled SFTP-only account (confirmed: a `sync: full` run
      # completed in ~2min vs the old action's ~7min).
      #
      # Now switched to sync: 'delta', its real incremental mode. Two things
      # that are NOT obvious from the README, found by reading its
      # action.yml source directly, and worth understanding before touching
      # this again:
      #
      #  - local-path is now './' (the actual git checkout), NOT a
      #    pre-filtered staging copy like the "full" run used. Delta mode
      #    determines what changed by running `git diff -- <local-path> ...`
      #    against the *real* repo -- if local-path pointed at an rsync'd
      #    copy outside the git working tree (like /tmp/deploy_staging was),
      #    that pathspec would match nothing and delta would silently
      #    upload zero files every run. Exclusions for delta mode are
      #    instead done via sync-delta-excludes, using git pathspec syntax
      #    (":(exclude)pattern", no leading slash -- a leading "/" is taken
      #    as a literal filesystem path by this particular syntax form and
      #    breaks; verified locally against this repo's real git history).
      #
      #  - assets/css/main.min.css, assets/css/main-nofooter.min.css,
      #    assets/css/footer.min.css, and assets/js/main.min.js are all
      #    committed to git, but only ever *regenerated* by the
      #    "Compile CSS and JS" step above -- they don't get re-committed
      #    by CI. That means a plain git-diff-based delta would only pick
      #    them up as "changed" on commits where someone manually rebuilt
      #    and committed them -- NOT on commits that only touch
      #    source/scss or source/js, since source/ is excluded from
      #    deploy and the compiled output isn't re-committed to reflect
      #    it. Left alone, that would silently deploy stale compiled
      #    CSS/JS whenever only the source changed. sync-delta-includes
      #    forces these four files into every deploy regardless of what
      #    git diff reports, closing that gap.
      - name: Deploy over SFTP
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: 'sftp'
          remote-host: ${{ vars.STAGING_HOST }}
          remote-port: ${{ vars.STAGING_PORT || 22 }}
          remote-user: ${{ secrets.STAGING_USERNAME }}
          remote-password: ${{ secrets.STAGING_PASS }}
          local-path: './'
          remote-path: ${{ vars.STAGING_REMOTE_PATH || secrets.STAGING_REMOTE_PATH }}
          # inputs.sync_mode only exists on a manual "Run workflow" dispatch;
          # on an ordinary push it's empty, so this falls back to the normal
          # incremental delta sync.
          sync: ${{ inputs.sync_mode || 'delta' }}
          # NOTE: this value gets spliced UNQUOTED into a shell command inside
          # the action's own script, so it must never contain literal parens
          # -- git's long-form ":(exclude)pattern" pathspec syntax breaks
          # bash parsing there ("syntax error near unexpected token '('").
          # Using the parenthesis-free short-form ":!pattern" instead.
          # ":!_archive" alone also fails (a separate git quirk: "Unimplemented
          # pathspec magic '_'" when '_' immediately follows '!') -- worked
          # around with a wildcard so '_' isn't the first character after '!'.
          # Both forms verified locally against this repo's real git history
          # before committing (git ls-files -- . <pathspec> to confirm exactly
          # what does/doesn't get excluded).
          sync-delta-excludes: >-
            :!/.git*
            :!/.github
            :!/node_modules
            :!/source
            :!*_archive*
            :!/package.json
            :!/package-lock.json
            :!/gulpfile.js
            :!/faviconData.json
            :!/README.md
          sync-delta-includes: 'assets/css/main.min.css,assets/css/main-nofooter.min.css,assets/css/footer.min.css,assets/js/main.min.js'
