name: Build and Deploy Theme (Production)

# Runs on every push to the "main" branch:
#   1. Installs Node deps and compiles CSS/JS from source/ via gulp
#      (build:styles compiles source/scss -> assets/css/main.min.css,
#       build:scripts bundles source/js + vendor libs -> assets/js/main.min.js)
#   2. Uploads the theme to the server over SFTP.
#
# Mirrors .github/workflows/deploy.yml (staging, "dev" branch) exactly, except:
#   - triggers on "main" instead of "dev"
#   - uses the "production" GitHub environment instead of "staging"
#   - uses PRODUCTION_* vars/secrets instead of STAGING_*
#
# Uses the "production" GitHub environment (Settings -> Environments -> production),
# which has all required values configured:
#   PRODUCTION_HOST         (environment variable)
#   PRODUCTION_PORT         (environment variable)
#   PRODUCTION_REMOTE_PATH  (environment variable)
#   PRODUCTION_USERNAME     (environment secret)
#   PRODUCTION_PASS         (environment secret)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 (full history, not just the last commit) is needed
          # by the deploy action's "delta" sync mode below, which diffs
          # against the previous commit to figure out what changed.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # See deploy.yml (staging) for the full history of why this is `npm ci`
      # against a lockfileVersion 3 package-lock.json rather than `npm install`.
      # If dependencies are ever added/updated, regenerate the lockfile locally
      # with `npm install` and commit it -- npm ci will hard-fail otherwise.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile CSS and JS
        run: npx gulp build:styles build:scripts

      # See deploy.yml (staging) for the full rationale behind
      # milanmk/actions-file-deployer, delta mode, and the exclude/include
      # lists below -- this job intentionally mirrors it so both environments
      # stay in sync and any future change to the deploy mechanics should be
      # applied to both files together.
      - name: Deploy over SFTP
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: 'sftp'
          remote-host: ${{ vars.PRODUCTION_HOST }}
          remote-port: ${{ vars.PRODUCTION_PORT || 22 }}
          remote-user: ${{ secrets.PRODUCTION_USERNAME }}
          remote-password: ${{ secrets.PRODUCTION_PASS }}
          local-path: './'
          remote-path: ${{ vars.PRODUCTION_REMOTE_PATH || secrets.PRODUCTION_REMOTE_PATH }}
          sync: 'delta'
          # NOTE: this value gets spliced UNQUOTED into a shell command inside
          # the action's own script, so it must never contain literal parens
          # -- git's long-form ":(exclude)pattern" pathspec syntax breaks
          # bash parsing there ("syntax error near unexpected token '('").
          # Using the parenthesis-free short-form ":!pattern" instead.
          # ":!_archive" alone also fails (a separate git quirk: "Unimplemented
          # pathspec magic '_'" when '_' immediately follows '!') -- worked
          # around with a wildcard so '_' isn't the first character after '!'.
          sync-delta-excludes: >-
            :!/.git*
            :!/.github
            :!/node_modules
            :!/source
            :!*_archive*
            :!/package.json
            :!/package-lock.json
            :!/gulpfile.js
            :!/faviconData.json
            :!/README.md
          sync-delta-includes: 'assets/css/main.min.css,assets/js/main.min.js'
